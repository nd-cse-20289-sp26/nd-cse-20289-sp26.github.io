  ## Quiz

  This week, the reading is split into two sections: the first part is a
  [dredd] quiz, while the second part involves one [C] program: [walk.c].

  To test the [C] program, you will need to download the [Makefile] and test
  scripts:

      :::bash
      $ git switch master                   # Make sure we are in master branch
      $ git pull --rebase                   # Make sure we are up-to-date with GitHub

      $ git switch -c reading08             # Create reading08 branch and check it out

      $ cd reading08                        # Go into reading08 folder

      # Download Reading 08 Makefile
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20289.sp26/static/txt/reading08/Makefile

      # Download Reading 08 walk.c
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20289.sp26/static/txt/reading08/walk.c

      # Download, build, and execute tests
      $ make test

