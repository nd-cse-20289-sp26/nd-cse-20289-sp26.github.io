  ## Submission

  To submit you work, follow the same process outlined in [Reading 01]:

      :::bash
      #--------------------------------------------------
      # Make sure you have already completed Preparation
      #--------------------------------------------------
      ...
      $ git add answers.json                # Mark changes for commit
      $ git commit -m "Reading 05: Quiz"    # Record changes
      ...
      $ git add Makefile                    # Mark changes for commit
      $ git add odds.py                     # Mark changes for commit
      $ git commit -m "Reading 05: Code"    # Record changes
      ...
      $ git push -u origin reading05        # Push branch to GitHub

