  ## Quiz

  This week the reading is split into two sections: the first part is a short
  [dredd] quiz, while the second part involves a [Python] script: `odds.py`.

  ### Preparation

  To test this script, you will need to download the [Makefile] and test
  scripts:

      :::bash
      $ git switch master                   # Make sure we are in master branch
      $ git pull --rebase                   # Make sure we are up-to-date with GitHub

      $ git switch -c reading05             # Create reading05 branch and check it out

      $ cd reading05                        # Go into reading05 folder

      # Download Makefile
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20289.sp26/static/txt/reading05/Makefile

      # Download Skeleton Code
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20289.sp26/static/txt/reading05/odds.py

