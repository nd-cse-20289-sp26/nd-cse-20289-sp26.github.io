    <div class="alert info-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "calendar-check" | embed_icon }}</i> Due Dates

    For each of the **four units** in this course:

    - Students must **complete** at least **one** **Reading** assignment.

    - Students must **complete** at least **one** **Homework** assignment.

    - Students must **perform** **one** coding **Interview**.

    For **Reading** and **Homework** assignments, these are due at **midnight**
    on the dates assigned.

    For coding **Interviews**, these take place during the week assigned and
    must be completed before taking the associated **exam** that week.  Because
    of this, students are required to schedule an appointment with a **teaching
    assistant** or the **instructor** ahead of time (*each interview is no more
    than `15` minutes long*).

    Completing extra assignments is **highly encouraged**, but will not count
    towards the course grade.

    Students may complete assignments associated with a particular **unit**
    after the specified assignment deadline as long as it is before the
    **exam** for the **unit**.  Afterwards, no late work will be accepted for
    that **unit**.

    </div>

    [GitHub]: https://github.com

