    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "scale-balance" | embed_icon }}</i> Assignments and Assessments

    Students are expected to do all the **Reading** and **Homework**
    assignments in this course, as they are **learning opportunities** that
    will prepare them for the coding **Interviews** and written **Exams**.

    For each of the **four Units** in this course:

    - Only the **Reading** assignment with the highest score from the **Unit**
      will be counted towards the final grade.

    - Only the **Homework** assignment with the highest score from the **Unit**
      will be counted towards the final grade.

    - A coding **Interview** will be conducted prior to the written **Exam** to
      assess understanding of practical skills.

    - A written **Exam** will be conducted to assess understanding and mastery
      of core concepts and skills.

    </div>
    
    <div class="alert warning-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "alert" | embed_icon }}</i> Exams

    To encourage growth and improvement throughout the semester, the **lowest**
    of the **three** `11` point exams will be replaced with the **average** of
    the remaining **two** `11` point exams.

    For instance, if a student scores `[6, 7, 9]`, then the adjusted exams
    scores would be `[8, 7, 9]`.

    The final is worth `15` points and is not included in this adjustment.

    </div>


    <div class="alert info-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "calendar-check" | embed_icon }}</i> Due Dates

    All **Reading** and **Homework** assignments are to be submitted to your
    own private [GitHub] repository. Unless specified otherwise:

    - **Reading** assignments are due by **noon** on the **Monday** of the
      assigned week.

    - **Homework** assignments are due by **noon** on the **Saturday** of the
      assigned week.

    - Coding **Interviews** are due during the week of the written **Exam** and
      must be scheduled with a **teaching assistant** or the **instructor**
      ahead of time.

    </div>

    [GitHub]: https://github.com

