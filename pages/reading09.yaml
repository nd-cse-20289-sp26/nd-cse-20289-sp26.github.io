  ## Quiz

  This week, the reading is split into two sections: the first part is a
  [dredd] quiz, while the second part involves one [C] program: `doit.c`.

  To test the [C] program, you will need to download the [Makefile] and test
  scripts:

      :::bash
      $ git switch master                   # Make sure we are in master branch
      $ git pull --rebase                   # Make sure we are up-to-date with GitHub

      $ git switch -c reading09             # Create reading09 branch and check it out

      $ cd reading09                        # Go into reading09 folder

      # Download Makefile
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20289.sp26/static/txt/reading09/Makefile

      # Download Starter code
      $ curl -LO https://pnutz.h4x0r.space/courses/cse.20289.sp26/static/txt/reading09/doit.c

      # Download, build, and execute tests
      $ make test

  [Makefile]: https://pnutz.h4x0r.space/courses/cse.20289.sp26/static/txt/reading09/Makefile

