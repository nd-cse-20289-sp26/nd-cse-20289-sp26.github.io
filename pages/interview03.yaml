title:      Interview 03
body:       |

    Next week, you will have the opportunity to demonstrate your mastery of the
    skills and concepts discussed in **Unit 03: C** to the instructor or a
    teaching assistant in a `15` minute in-person **coding interview**.

    This interview will evaluate your proficiency in the following areas:

    1. Writing a [Makefile].

    2. Debugging **segfaults**.

    3. Walking [linked lists].

    4. Fixing memory errors.

    More details of what you need to know about these particular areas can be
    found in [Checklist 03].

    [linked lists]: https://en.wikipedia.org/wiki/Linked_list

    ## Scheduling

    To schedule a **coding interview** appointment, put your **netid** (ie.
    `pbui`) in an open cell in a timeslot with an interviewer in the following:

    <div class="centered">
      <a class="badge warning-btn" href="https://docs.google.com/spreadsheets/d/1ym81X3is03PUbJfD-gBC6lV3sdTxxu7FkEpelq49xu0/edit?usp=sharing" target="_new" style="font-size: 150%;">Interview 03 Spreadsheet</a>
    </div>

    The location of the interviewer can be found in the **Locations** tab of
    the [Interview 03 Spreadsheet].

    <div class="alert warning-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "calendar-clock" | embed_icon }}</i> Scheduling Deadline

    For planning purposes, please schedule your **Interview 03** appointment by
    **midnight, Friday, March 27**.

    You may only signup for **one** appointment timeslot.

    </div>

    [Interview 03 Spreadsheet]: https://docs.google.com/spreadsheets/d/1ym81X3is03PUbJfD-gBC6lV3sdTxxu7FkEpelq49xu0/edit?usp=sharing

    ## Sample Interview

    Here is an example of the types of tasks the interviewer may ask you to
    perform:

    -   <div class="flex-col" markdown="1">

        [ ] Download the following:

        - `Makefile`: [https://yld.me/raw/fRUp](https://yld.me/raw/fRUp)
        - `str_counts.c`: [https://yld.me/raw/naMM](https://yld.me/raw/naMM)

    - [ ] Complete the `Makefile` and build `str_counts` (fix the compiler
      error in `main`).

    - [ ] Run `echo reasonable exam | ./str_counts`, identify any segfaults,
      and fix them.

    - [ ] Run `echo reasonable exam | ./str_counts`, identify any memory
      errors, and fix them.

    - [ ] Use `make test` to verify functional correctness and memory safety.

    <div class="alert success-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "lightbulb-outline" | embed_icon }}</i> Hints

    - You should be familiar with using [git] to create a branch, record a
      commit, and upload changes to [GitHub].

    - You should be familiar with downloading files using [curl] or [wget].

    - You should be familiar with [gdb] (or any *debugger*).

    - You should be familiar with [valgrind].

    </div>

    [Makefile]: https://www.gnu.org/software/make/manual/make.html
    [gdb]: https://www.gnu.org/software/gdb/
    [valgrind]: http://valgrind.org/

    <div class="alert warning-bg" markdown="1">

    ### <i class="icon icon-medium">{{ "alert" | embed_icon }}</i> Consulting Resources

    As with your **Reading** and **Homework** assignments, you are allowed to
    consult the course texts, slides, notes, the Internet, and even **AI
    tools**.  However, you cannot communicate with anyone else nor can you ask
    an **AI tool** to generate a solution.

    Be mindful that the interviewer is assessing your **proficiency** and how
    much you have **internalized**.  Over reliance on any external resource
    will be viewed **negatively** in regards to your **mastery** of the material.

    </div>

    [Checklist 03]: checklist03.html
    [git]: https://git-scm.com/
    [GitHub]: https://github.com/
    [curl]: https://curl.haxx.se/docs/manpage.html
    [wget]: http://man7.org/linux/man-pages/man1/wget.1.html

    ## Extra Credit (*`0.5` Points*)

    For extra credit, you may create an original [zine] (ala [Julia Evans])
    related to the topics for **Exam 03** by **Wednesday, April 1**:

    - **Compiling and Building**: Compiler pipeline, dynamic vs static executables, Makefiles
    - **Pointers**, **Arrays**, **Strings**: Declaration, initialization, dereferencing, accessing, iterating
    - **Memory Allocation**: Address space, stack vs heap, structs, unions
    - **Bitsets**: Integer sizes, boolean operations
    - **Linked Lists**: Construction, destruction, iteration, inserting, deletion, access
    - **Data Representation**: Signed vs Unsigned, Little vs Big Endian

    <div class="alert danger-bg" markdown="1">

    **Note**: **AI** generated [zines] will not receive any credit.

    </div>

