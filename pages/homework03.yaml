  ### <i class="icon icon-medium">{{ "alert" | embed_icon }}</i> Bashisms

  Remember that our class uses `sh` and that was demonstrated in class.  In the
  testing environment, the runner *strictly enforces which interpreter is used*
  (whereas on the student machines, `sh` is aliased to `bash`), so you may pass
  on the **student machines** but not on [GitHub] while using `bash` syntax.  Here
  are some examples of things that work in `bash` but not `sh`:

  - `[[ ... ]]` this is specific to `bash` ... use `[ ... ]` instead
  - `${asdf// /}` this is specific to `bash`... use `$(echo $var | sed 's/..//')` instead
  - `[ ... ~= ... ]` this is specific to `bash` ... use `grep` instead

  If you find that your script is using `bash` syntax and you do not want to
  change it, then simply modify your script's *she-bang* from `#!/bin/sh` to
  `#!/bin/bash` to reflect the appropriate language interpreter.

  **Note**: for the upcoming exam, you are not expected to know `bash`, but you
  are expected to know `sh` when it comes to scripting.

  </div>

