  ## Submission

  To submit your answers, you will need to create an `answers.json` file in the
  `reading01` folder of your **assignments** repository:

  1.  <div class="flex-col">

      If you have not already, follow the instructions at the top of this
      document to create a `reading01` branch in your **assignments** [Git]
      repository.

  2.  <div class="flex-col">

      You can either hand-write the `answers.json` file using your favorite text
      editor or you can use the online form to generate the [JSON] data, which should
      look like the following:

          :::json
          {
              "q01": [
                  "stdin",
                  "stdout",
                  "stderr"
              ],
              "q02": "yes",
              "q03": [
                  "a",
                  "b"
              ],
              "q04": [
                  "a",
                  "b"
              ],
              "q05": [
                  "ls"
              ],
              "q06": [
                  "beastie"
              ],
              "q07": [
                  "beastie"
              ],
              "q08": [
                  "800"
              ],
              "q09": [
                  "b"
              ],
              "q10": [
                  "homeworks"
              ]
          }

      To determine which symbols correspond to which response, take a look at
      the [Reading 01 Quiz] file.

      To check your answers, you can use the provided `.scripts/check.py` script:

          :::bash
          $ cd reading01                        # Go into reading01 folder

          $ $EDITOR answers.json                # Edit your answers.json file

          $ ../.scripts/check.py                # Check reading01 quiz
          Checking reading01 quiz ...
               Q01  9.00 /  9.00
               Q02  1.00 /  1.00
               Q03  2.00 /  2.00
               Q04  3.00 /  3.00
               Q05  4.00 /  4.00
               Q06  2.00 /  2.00
               Q07  2.00 /  2.00
               Q08  3.00 /  3.00
               Q09  6.00 /  6.00
               Q10  7.00 /  7.00
            --------------------
             Score 39.00 / 39.00
             Grade  1.00 /  1.00
            Status Success

      This script will check your responses by sending your
      `reading01/answers.json` file to [dredd], which is the automated grading
      system. [dredd] will take your answers and return to you a score and
      overall status as shown above.

      <div class="alert success-bg" markdown="1">

      **Note**: `Score` is how many points you received out of the maximum
      number of attempted points, while `Grade` is the amount of normalized
      points that will be recorded on **Canvas**.

      Moreover, `Status` is `Success` if you have achieved full credit
      (otherwise, it will show `Failure`).

      </div>

      <div class="alert warning-bg" markdown="1">

      ### <i class="icon icon-medium">{{ "repeat" | embed_icon }}</i> Try, Try, Try again

      You may check your quiz answers as many times as you want; [dredd] does
      not keep track of who submits what or how many times. It simply returns a
      score.
      </div>

  3.  <div class="flex-col">

      Once you have your `answers` file, you need to [add], [commit] the file,
      and [push] your commits to [GitHub]:

          :::bash
          $ git add answers.json                # Add answers.json to staging area

          $ git commit -m "Reading 01: Quiz"    # Commit work

          $ git push -u origin reading01        # Push branch to GitHub

      <div class="alert success-bg" markdown="1">

      ### <i class="icon icon-medium">{{ "git" | embed_icon }}</i> Iterative Approach

      You may edit and commit changes to your branch as many times as you wish.
      Just make sure all of your work goes in the appropriate branch and then
      perform a `git push` when you are done.
      </div>

  4.  <div class="flex-col">

      When you are ready for your final submission, you need to create a [Pull
      Request] via the [GitHub] interface:

      -   <div class="flex-col">

          If you have a **Compare & pull request** button corresponding to your
          `reading01` branch on your repository page, then you can click on
          that button.

          <div class="centered">
            <img src="static/img/reading01-github-compare-pr.png" class="responsive">
          </div>

          <div class="alert info-bg" markdown="1">

          ### <i class="icon icon-medium">{{ "git" | embed_icon }}</i> Pull Request URL

          As an alternative, when you first do a `git push` on the
          command-line, [git] will also give you a **URL** that you can click
          to create a **Pull Request**.

          </div>

      -   <div class="flex-col">

          If you do not have the **Compare & pull request** button, then go to
          your repository's **Branches** page and then press the
          **New pull request** button for the appropriate branch:

          <div class="centered">
            <img src="static/img/reading01-github-branches.png" class="responsive">
          </div>

      -   <div class="flex-col">

          Next, edit the **Pull Request** title to "Reading 01", write a
          comment if necessary, assign the appropriate **TA** from the [Reading
          01 TA List], and then press the "Create pull request" button.

          <div class="centered">
            <img src="static/img/reading01-github-pull-request.png" class="responsive">
          </div>

          <div class="alert danger-bg" markdown="1">

          ### <i class="icon icon-medium">{{ "close-octogon" | embed_icon }}</i> Don't Merge!

          **DO NOT MERGE your own Pull Requests**.  The TAs use open **Pull Requests**
          to keep track of which assignments to grade.  Closing them yourself will
          confuse the TAs and cause a delay in grading.

          </div>

      -   <div class="flex-col">

          Every commit on [GitHub] will automatically submit your quiz or code to
          [dredd] and the results of each run is displayed in the **Checks** tab of
          each commit as shown below:

          <div class="centered">
            <img src="static/img/reading01-github-checks.png" class="responsive">
          </div>

    Once you have made the **Pull Request**, the TA can verify your work and
    provide feedback via the discussion form inside the **Pull Request**. If
    necessary, you can update your submission by simply commit and pushing to
    the appropriate branch; the **Pull Request** will automatically be updated
    to match your latest work.

  <div class="alert warning-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "lifebuoy" | embed_icon }}</i> Acknowledgments

  If you collaborated with any other students, or received help from TAs or AI
  tools on this assignment, please record this support in the `README.md` in
  the `reading01` folder and include it with your **Pull Request**.

  </div>

  <div class="alert success-bg" markdown="1">

  ### <i class="icon icon-medium">{{ "account-question" | embed_icon }}</i> Graders

  Once you have committed your work and pushed it to [GitHub], remember to
  create a **pull request** and assign it to the appropriate **teaching
  assistant** from the [Reading 01 TA List].

  **Note**: this list changes each week, so be sure to consult the appropriate
  list for each assignment.

  </div>

