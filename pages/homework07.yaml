      :::bash
      $ git add Makefile                            # Mark changes for commit
      $ git add *.c *.h                             # Mark changes for commit
      $ git commit -m "Homework 07: Initial Import" # Record changes

  ### Task 3: Unit Tests

  After downloading these files, you can run `make test` to run the tests.

      :::bash
