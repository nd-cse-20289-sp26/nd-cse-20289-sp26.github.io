  ### Script: `exists.py`

  Use the `echo.py` script as the basis for a Python script called `exists.py`,
  which accomplishes the same task as the modified version of `exists.sh` in [Reading 02]:

      :::bash
      # Run script and check error code
      $./exists.py * && echo Success
      exists.py exists!
      README.md exists!
      Success

      $ ./exists.py * ASDF || echo Success
      # Run script and check error code
      exists.py exists!
      README.md exists!
      ASDF does not exist!
      Success

  #### Testing

  To test your `exists.py`, you can use the `test_exists.sh` script downloaded
  by the [Makefile]:

      :::bash
      $ ./test_exists.sh                    # Test your exists.py
      Checking reading04 exists.py ...
        exists.py                                ... Success
        exists.py *                              ... Success
        exists.py * ASDF                         ... Success
        exists.py ASDF * FDSA                    ... Success
        exists.py /lib/*                         ... Success
        --------------------
         Score 5.00 / 5.00
         Grade 1.00 / 1.00
        Status Success

  <div class="alert success-bg" markdown="1">
  #### Hints

  - You will probably want to use [os.path.exists] to check if a file exists.

  - You will probably want to use [sys.exit] at the end of the script to return
    `0` if all files exist, otherwise return `1` any of the files does not
    exist.

  - You will probably want to use [string formatting] or [f-strings] when
    printing.

  [os.path.exists]: https://docs.python.org/3/library/os.path.html#os.path.exists
  [sys.exit]: https://docs.python.org/3/library/sys.html#sys.exit
  [string formatting]: https://pyformat.info/
  [f-strings]: http://zetcode.com/python/fstring/
  </div>

