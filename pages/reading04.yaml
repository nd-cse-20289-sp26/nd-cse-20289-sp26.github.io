  <div class="flex-col" markdown="1">

  The readings for this week are:

  1. [Scientific Python Lecture Notes: 1.2. The Python
    language](https://lectures.scientific-python.org/intro/language/python_language.html)

  2. [A Byte of Python - Data
  Structures](https://python.swaroopch.com/data_structures.html)

